<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9e7ff;
      color: #211c36;
      font-family: system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(30rem, calc(100% - 2rem));
      padding: clamp(2rem, 8vw, 4rem);
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1rem 3rem #211c3614;
      text-align: center;
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2.5rem, 9vw, 4rem);
      letter-spacing: -.06em;
    }
    p { margin: 0 0 1.5rem; }
    button {
      padding: .85rem 1.25rem;
      border: 0;
      border-radius: .65rem;
      background: #372869;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #49378a; }
    button:focus-visible { outline: 3px solid #372869; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome!</h1>
    <p>Try the button to cycle through five colors.</p>
    <button type="button">Change background color</button>
  </main>
  <script>
    const colors = ['#e9e7ff', '#d9f3e5', '#ffe4d4', '#dcecff', '#ffe3ef'];
    let colorIndex = 0;

    document.querySelector('button').addEventListener('click', () => {
      colorIndex = (colorIndex + 1) % colors.length;
      document.body.style.backgroundColor = colors[colorIndex];
    });
  </script>
</body>
</html>
